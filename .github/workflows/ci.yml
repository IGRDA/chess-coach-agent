name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      # The extras are checked, so they have to be installed. mypy reads the whole
      # tree including evals/, whose imports (deepeval, phoenix, pypdf, anthropic)
      # live in the optional extras; without them their base classes degrade to
      # Any and the run fails on errors that say nothing about the code.
      - name: Install dependencies
        run: uv sync --dev --all-extras

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format . --check

      - name: mypy
        run: uv run mypy .

      - name: pytest
        run: uv run pytest --cov

      - name: pre-commit
        run: uv run pre-commit run --all-files
